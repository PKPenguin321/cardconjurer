[package]
name = "cardconjurer-desktop"
version = "0.1.0"
description = "Desktop version of the CardConjurer card creator"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
